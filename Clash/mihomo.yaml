  #   public-key: "public-key"   # 自行替换
  #   udp: true
  #   reserved: "abba"           # 自行替换
  #   mtu: 1280
  #   dialer-proxy: "WARP前置"
  #   remote-dns-resolve: true
  #   dns:
  #     - https://dns.cloudflare.com/dns-query

proxy-groups:
  # 使用 WARP 的用户需要手动在下方的 proxies 字段内添加 WARP
  # 例如 [WARP, 手动选择, 香港, 台湾, 日本, 新加坡, 美国, 其它地区, DIRECT],
  - { name: 节点选择, type: select, proxies: [香港, 台湾, 日本, 新加坡, 美国, 手动选择, 其它地区, DIRECT] }
  - { name: 手动选择, <<: *select }
  - { name: 回家服务, type: select, use: [订阅一], filter: "(?i)家|回家|home", proxies: [DIRECT] }
  # 这里的 dns 指海外解析 dns 走的节点，一般跟随节点选择即可
# - { name: dns, <<: *pr }
  # WARP 配置链式出站
  # - { name: WARP前置, <<: *pr, exclude-type: "wireguard" }
  - { name: 财新传媒, <<: *select, filter: "(?i)财新|caixin|cx", proxies: [DIRECT] }
  - { name: 人工智能, type: select, proxies: [手动选择, 香港, 台湾, 日本, 新加坡, 美国, 其它地区] }
# - { name: Google, <<: *pr }
# - { name: Telegram, <<: *pr }
# - { name: Twitter, <<: *pr }
# - { name: Pixiv, <<: *pr }
# - { name: ehentai, <<: *pr }
  # 下面两个看需求启用，打开之后会代理全站流量，可能导致部分版权视频反而无法播放或视频播放速度缓慢
  # 下面 rules 两条也要启用
# - {name: 哔哩哔哩, type: select, proxies: [DIRECT,香港, 台湾] }
# - {name: 哔哩东南亚, <<: *pr}
# - { name: 巴哈姆特, <<: *pr }
  - { name: YouTube, <<: *pr }
  - { name: NETFLIX, <<: *pr }
# - { name: TikTok, <<: *pr }
# - { name: Spotify, <<: *pr }
# - { name: Github, <<: *pr }
  - { name: Steam, <<: *pr }
  - { name: 海外娱乐, <<: *pr }
  - { name: 苹果服务, type: select, proxies: [DIRECT, 节点选择, 手动选择] }
  - { name: OneDrive, type: select, proxies: [DIRECT, 节点选择, 手动选择] }
  - { name: 微软服务, type: select, proxies: [DIRECT, 节点选择, 手动选择] }
  - { name: 广告拦截, type: select, proxies: [REJECT, DIRECT, 节点选择] }
  - { name: 漏网之鱼, <<: *pr }

  # 分隔,下面是地区分组
  - { name: 香港, <<: *urltest, filter: "(?i)港|hk|hongkong|hong kong" }
  - { name: 台湾, <<: *urltest, filter: "(?i)台|tw|taiwan" }
  - { name: 日本, <<: *urltest, filter: "(?i)日本|jp|japan" }
  - { name: 美国, <<: *urltest, filter: "(?i)美|us|unitedstates|united states" }
  - { name: 新加坡, <<: *urltest, filter: "(?i)(新加坡|sg|singapore)" }
  - {
      name: 其它地区,
      <<: *urltest,
      filter: "(?i)^(?!.*(?:🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|家|回家|home|财新|caixin|cx|港|hk|hongkong|台|tw|taiwan|日|jp|japan|新|sg|singapore|美|us|unitedstates)).*",
    }

# 订阅规则锚点
rule-anchor:
  classical_text: &classical_text {type: http, behavior: classical, interval: 86400, format: text, proxy: 节点选择}
  classical_yaml: &classical_yaml {type: http, behavior: classical, interval: 86400, format: yaml, proxy: 节点选择}
  domain_text: &domain_text {type: http, behavior: domain, interval: 86400, format: text, proxy: 节点选择}
  domain_yaml: &domain_yaml {type: http, behavior: domain, interval: 86400, format: yaml, proxy: 节点选择}
  ip: &ip {type: http, behavior: ipcidr, interval: 86400, format: yaml, proxy: 节点选择}
  
# 订阅规则
# 秋风广告拦截规则
# https://awavenue.top
# 由于 Anti-AD 误杀率高，本项目已在 1.11-241024 版本更换秋风广告规则
rule-providers:
  LocalAreaNetwork:
    <<: *classical_text
    path: ./rule_provider/LocalAreaNetwork.txt
    url: https://raw.githubusercontent.com/frankk007/ACL4SSR/refs/heads/doctor/Clash/LocalAreaNetwork.txt

  AWAvenue-Ads:
    <<: *domain_yaml
    path: ./rule_provider/AWAvenue-Ads.yaml
    url: https://ghfast.top/https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml

  abcDirect:
    type: inline
    behavior: domain
    payload:
      - 'sciencedirect.com'
      - '.elsevier.com'
      - '.zotero.org'
      - '.quickconnect.to'
      - '.quickconnect.cn'
      - '*m-team*'
      - 'hhanclub.top'
      - 'hhan.club'
      - '*open.cd*'
      - '*ptzone*'

  WeChat:
    <<: *classical_yaml
    path: ./rule_provider/WeChat.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/WeChat/WeChat_No_Resolve.yaml

  PayPal:
    <<: *classical_yaml
    path: ./rule_provider/PayPal.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.yaml

  财新传媒:
    <<: *classical_text
    path: ./rule_provider/Caixin.txt
    url: https://raw.githubusercontent.com/frankk007/ACL4SSR/doctor/Clash/Caixin.txt

rules:
  - IP-CIDR,192.168.2.0/24,回家服务,no-resolve
  - RULE-SET,LocalAreaNetwork,DIRECT
  - DOMAIN-SUFFIX,adobe.io,REJECT
  # 若需禁用 QUIC 请取消注释 QUIC 两条规则
  # 防止 YouTube 等使用 QUIC 导致速度不佳, 禁用 443 端口 UDP 流量（拦截所有指向 非中国 IP 的 UDP 443（QUIC）流量）
  - AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOSITE,cn))),REJECT
  - AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((GEOIP,CN))),REJECT
  - RULE-SET,AWAvenue-Ads,广告拦截
  - RULE-SET,abcDirect,DIRECT
  - RULE-SET,WeChat,DIRECT
  - RULE-SET,PayPal,DIRECT
  - GEOSITE,geolocation-!cn@cn,DIRECT
# - GEOSITE,bilibili,哔哩哔哩
  - GEOSITE,apple,苹果服务
  - RULE-SET,财新传媒,财新传媒
  - GEOSITE,category-ai-!cn,人工智能
  - GEOSITE,github,节点选择
  - GEOSITE,twitter,节点选择
  - GEOSITE,youtube,YouTube
  - GEOSITE,google,节点选择
# - GEOSITE,google-cn,节点选择 # Google CN 不走代理会导致香港等地区节点 Play Store 异常
  - GEOSITE,telegram,节点选择
  - GEOSITE,netflix,NETFLIX
  - GEOSITE,tiktok,节点选择
# - GEOSITE,bahamut,巴哈姆特
# - GEOSITE,spotify,Spotify
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,Steam
  - GEOSITE,onedrive,OneDrive
  - GEOSITE,microsoft,微软服务
# - GEOSITE,category-games-!cn,节点选择
  - GEOSITE,category-entertainment,海外娱乐 # 包含游戏、二次元、流媒体直播、音乐播客、动漫、小说、图片、影视数据库、成人等很多子集
  - GEOSITE,geolocation-!cn,漏网之鱼 
  - GEOSITE,geolocation-cn@!cn,漏网之鱼
# - GEOSITE,geolocation-cn,DIRECT
# - GEOSITE,tld-cn,DIRECT # 所有以 .cn 为后缀的域名
  - GEOSITE,CN,DIRECT # 包含上面两个子集 include:tld-cn与include:geolocation-cn
  - GEOIP,google,节点选择
  - GEOIP,netflix,NETFLIX
  - GEOIP,telegram,节点选择
  - GEOIP,twitter,节点选择
# - GEOIP,CN,DIRECT

  ### IP 类规则
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - MATCH,漏网之鱼
